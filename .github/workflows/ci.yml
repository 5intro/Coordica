name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maintainability risk report
        run: python -I scripts/check-quality.py
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node --test examples/acceptance/test/greeting.test.mjs
      - run: go run ./cmd/contractgen
      - run: git diff --exit-code -- api/v1.schema.json web/src/api.generated.ts
      - run: go vet ./...
      # The Windows application regressions use real Git/process boundaries;
      # allow the full package to finish while retaining the supervisor limits.
      - run: python scripts/test-go.py -- -race -timeout=15m ./...
      - run: go build -trimpath -o bin/coordica ./cmd/coordica
