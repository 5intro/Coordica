name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    env:
      GO_TEST_BATCH_PATTERN: '^Test[A-M]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Required maintainability gate
        run: python -I scripts/check-quality.py
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node --test examples/acceptance/test/greeting.test.mjs
      - run: go run ./cmd/contractgen
      - run: git diff --exit-code -- api/v1.schema.json web/src/api.generated.ts
      - run: go vet ./...
      # Real Git/process boundaries make a single package slow on Windows.
      # Complementary filters retain all tests, examples and fuzz seeds, with
      # independent bounded deadlines and supervised cleanup for each batch.
      - name: Go race tests (first batch)
        run: python scripts/test-go.py -- -race -timeout=15m -skip '${{ env.GO_TEST_BATCH_PATTERN }}' ./...
      - name: Go race tests (second batch)
        run: python scripts/test-go.py -- -race -timeout=15m -run '${{ env.GO_TEST_BATCH_PATTERN }}' ./...
      - run: go build -trimpath -o bin/coordica ./cmd/coordica
